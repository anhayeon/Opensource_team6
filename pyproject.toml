[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seeallcolors"
version = "0.1.1"
description = "Simulate color vision deficiency and enhance image color contrast"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Opensource_team6" }]
dependencies = [
    "Pillow>=10",
    "numpy>=1.26",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/anhayeon/Opensource_team6"
Documentation = "https://anhayeon.github.io/Opensource_team6/"
Issues = "https://github.com/anhayeon/Opensource_team6/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/seeallcolors"]