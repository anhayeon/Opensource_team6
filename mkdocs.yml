site_name: Opensource_team6
site_url: https://github.com/anhayeon/Opensource_team6

theme:
  name: material

nav:
  - Home: index.md
  - Proposal: proposal.md
  - Team rules: team-rules.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google